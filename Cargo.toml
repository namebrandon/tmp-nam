[workspace]
resolver = "2"
members = ["crates/sdcard", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
authors = ["Pedro CAVADAS"]
license = "MIT"

# Hashing gigabytes in an unoptimized dev build takes minutes; optimize the hot crates.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.tmp-sdcard]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
plist = "1"
