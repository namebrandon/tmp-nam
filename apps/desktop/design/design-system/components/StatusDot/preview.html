<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusDot</title>
<style>body{margin:0;background:var(--bg-content)} #root{padding:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}</style>
</head>
<body class="tn-root">
<div id="root"></div>
<script>
var T = window.TmpNam, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(T.StatusDot, { tone: 'ok', label: 'Connected' }), h(T.StatusDot, { tone: 'warn', label: '2 captures need attention' }),
  h(T.StatusDot, { tone: 'danger', label: 'Failed' }), h(T.StatusDot, { tone: 'off', label: 'Not connected' })));
</script>
</body>
</html>
