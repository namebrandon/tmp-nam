<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title>
<style>body{margin:0;background:var(--bg-content)} #root{padding:16px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:12px 8px} .c{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--text-3)} .c .tn-icon{color:var(--text)}</style>
</head>
<body class="tn-root">
<div id="root"></div>
<script>
var T = window.TmpNam, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, T.Icon.names.map(function (n) {
  return h('div', { key: n, className: 'c' }, h(T.Icon, { name: n }), n);
})));
</script>
</body>
</html>
