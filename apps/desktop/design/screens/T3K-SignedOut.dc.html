<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tone3000, signed out</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1A4BBB}a:hover{color:#153D9A}
</style>
</helmet>
<div class="win {{theme}}" style="width: 960px; height: 700px">
  <dc-import name="Sidebar" active="tone3000" conn="connected" count="9" theme="{{theme}}" hint-size="200px,700px"></dc-import>
  <div class="main">
    <header class="toolbar"><h1 class="ttl">Tone3000</h1><span class="sub">Not signed in</span></header>
    <div class="center">
      <div class="empty" style="max-width: 440px; gap: 16px">
        <h2 class="t-title">Sign in to Tone3000</h2>
        <p class="muted">Your API key is saved. Sign in to see your bookmarks and your own tones.</p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <button class="btn btn-primary btn-lg" style="align-self: flex-start">Sign In with Browser<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v4h-9v-9h4"/></svg></button>
          <span class="help">Opens tone3000.com in your browser. Approve access there, then come back.</span>
        </div>
        <div class="divider" style="align-self: stretch"></div>
        <span class="t-sm muted3">Wrong key? <a href="#settings">Change it in Settings</a>.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.appearance === 'Dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
