<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tone3000, signing in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="screens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1A4BBB}a:hover{color:#153D9A}
</style>
</helmet>
<div class="win {{theme}}" style="width: 960px; height: 700px">
  <dc-import name="Sidebar" active="tone3000" conn="connected" count="9" theme="{{theme}}" hint-size="200px,700px"></dc-import>
  <div class="main">
    <header class="toolbar"><h1 class="ttl">Tone3000</h1><span class="sub">Signing in…</span></header>
    <div class="center">
      <div class="empty" style="max-width: 440px; gap: 16px" aria-live="polite">
        <div style="display: flex; align-items: center; gap: 12px"><span class="spinner lg"></span><h2 class="t-title">Waiting for you in the browser</h2></div>
        <p class="muted">Approve TMP NAM on the Tone3000 page that just opened. This window continues on its own once you do.</p>
        <div style="display: flex; gap: 8px"><button class="btn">Open Page Again</button><button class="btn">Cancel</button></div>
        <span class="help">Closed the tab by mistake? Open Page Again. Changed your mind? Cancel; nothing is saved.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.appearance === 'Dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
