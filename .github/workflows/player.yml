name: player

# Rebuilds the card's ARM binaries from source and checks they are byte-identical to the
# checked-in device/bin/ files and device/licenses/. Publishing new binaries stays manual
# (tools/release/publish_release.py after an on-unit check); this only proves that what is
# checked in comes from the checked-in sources and pins.
#
# Not a required status check: it runs only when player inputs or the published files
# change (paths filters), and a path-filtered required check would block every other PR.
on:
  push:
    branches: [main]
    paths: &player-paths
      - player/**
      - tools/release/**
      - device/bin/**
      - device/licenses/**
      - device/release.json
      - .github/workflows/player.yml
  pull_request:
    paths: *player-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  reproduce:
    # The pinned cross-toolchain (player/toolchains/messense-v1.1.0.json) is a macOS
    # Apple Silicon build; macos-latest runners are arm64.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tools/release needs Python 3.11+ (hashlib.file_digest).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the player from source
        run: python3 tools/release/build_player.py --output "$RUNNER_TEMP/player-build"

      - name: Compare with device/
        run: python3 tools/release/publish_release.py --check --build "$RUNNER_TEMP/player-build"
