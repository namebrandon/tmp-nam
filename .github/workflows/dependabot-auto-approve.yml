name: Dependabot auto-approve

# GitHub's "Automating Dependabot with GitHub Actions" approve example
# (https://docs.github.com/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions),
# without the fetch-metadata step: every Dependabot PR is approved, so it satisfies
# the "protect main" review requirement (CodeRabbit does not review bot PRs). The
# required CI checks still gate the merge. No checkout: PR code never runs here.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests".

on: pull_request

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'pcavadas/tmp-nam'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve the PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
