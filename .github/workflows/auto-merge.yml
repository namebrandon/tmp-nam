name: auto-merge

# Turns on GitHub's native auto-merge (squash) for the owner's and Dependabot's PRs into
# main. GitHub then merges once the "protect main" ruleset is satisfied: green required
# checks and an approving review (CodeRabbit's for the owner, dependabot-auto-approve.yml
# for Dependabot). External PRs are never armed here: @pcavadas reviews and merges them
# by hand.
#
# Armed with a GitHub App token, not GITHUB_TOKEN: GitHub attributes the eventual merge
# push to whoever enabled auto-merge, and pushes made by GITHUB_TOKEN never trigger
# workflows, so release.yml would silently not run. No checkout: PR code never runs here.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    if: >-
      (github.event.pull_request.user.login == 'pcavadas'
      || github.event.pull_request.user.login == 'dependabot[bot]')
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
